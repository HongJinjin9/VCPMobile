[package]
name = "tauri-plugin-vcp-mobile"
version = "1.0.0"
authors = ["MRiecy"]
description = "VCP Mobile platform native capabilities plugin"
edition = "2021"
rust-version = "1.90"
links = "tauri-plugin-vcp-mobile"

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }

[build-dependencies]
tauri-plugin = { version = "2.7.1", features = ["build"] }
